[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bbo-viso"
dynamic = ["version"]
description = "Simple visual odometry for omnidirectional cameras"
readme = "README.md"
license = "LGPL-3.0-or-later"
authors = [
    { name = "BBO-lab @ caesar", email = "kay-michael.voit@mpinb.mpg.de" },
]
classifiers = [
    "License :: OSI Approved :: GNU Lesser General Public License v2 or later (LGPLv2+)",
    "Programming Language :: Python :: 3.10",
]
dependencies = [
    "bbo-bbo",
    "bbo-calibcam",
    "bbo-calibcamlib",
    "jax",
    "numpy",
    "scipy",
    "tqdm",
]

[project.urls]
Homepage = "https://github.com/bbo-lab/bboVisO"

[tool.hatch.version]
path = "bboVisO/__init__.py"

[tool.hatch.build.targets.sdist]
include = [
    "/bboVisO",
]

[tool.hatch.build.targets.wheel]
      packages = ["bboVisO"]

